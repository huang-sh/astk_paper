name: Build open-access PhD literature bundle

on:
  push:
    branches:
      - chatgpt-literature-bundle-20260926
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Assemble inputs and strengthen OA retrieval
        run: |
          cat data/references_part_*.jsonpart > data/references.json
          cat scripts/download_literature_part_*.pypart > scripts/download_literature.py
          python - <<'PY'
          import json
          from pathlib import Path

          refs_path = Path('data/references.json')
          refs = json.loads(refs_path.read_text(encoding='utf-8'))
          # One chunk boundary introduced a duplicate/corrupt ID 58 record. Keep the later,
          # complete entry and enforce the intended 1..211 bibliography.
          dedup = {int(ref['id']): ref for ref in refs}
          refs = [dedup[i] for i in sorted(dedup)]
          assert len(refs) == 211 and [r['id'] for r in refs] == list(range(1, 212))
          refs_path.write_text(json.dumps(refs, ensure_ascii=False), encoding='utf-8')

          script_path = Path('scripts/download_literature.py')
          script = script_path.read_text(encoding='utf-8')
          script = script.replace("{author'}", "{author}")
          script = script.replace('crossref_year(item) or year', 'crossref_year(crossref) or year')
          script = script.replace('TIMEOUT = 50', 'TIMEOUT = 25')
          script = script.replace('attempts: int = 4', 'attempts: int = 3')

          helper_anchor = '\n\ndef download_pdf('
          assert helper_anchor in script
          helper = r'''

def unpaywall_candidates(client: HTTPClient, doi: str) -> tuple[list[tuple[str, str]], str, str]:
    candidates: list[tuple[str, str]] = []
    if not doi:
        return candidates, "", ""
    data = client.json(
        f"https://api.unpaywall.org/v2/{quote(doi, safe='/')}",
        params={"email": "hsh-me@outlook.com"},
    )
    if not data or not data.get("is_oa"):
        return candidates, "", ""
    oa_status = str(data.get("oa_status") or "")
    landing = ""
    locations: list[dict[str, Any]] = []
    if isinstance(data.get("best_oa_location"), dict):
        locations.append(data["best_oa_location"])
    locations.extend(loc for loc in (data.get("oa_locations") or []) if isinstance(loc, dict))
    seen: set[str] = set()
    for loc in locations:
        key = str(loc.get("url_for_pdf") or loc.get("url") or "")
        if not key or key in seen:
            continue
        seen.add(key)
        if not landing and loc.get("url"):
            landing = str(loc["url"])
        add_candidate(candidates, loc.get("url_for_pdf"), "Unpaywall OA location")
    return candidates, oa_status, landing


def pmc_oa_pdf_candidate(client: HTTPClient, pmcid: str) -> str:
    if not pmcid:
        return ""
    import xml.etree.ElementTree as ET
    response = client.get(
        "https://www.ncbi.nlm.nih.gov/pmc/utils/oa/oa.fcgi",
        params={"id": pmcid},
        accept="application/xml,text/xml;q=0.9,*/*;q=0.1",
    )
    if response is None:
        return ""
    try:
        if response.status_code != 200:
            return ""
        root = ET.fromstring(response.content)
        for link in root.findall('.//link'):
            if str(link.attrib.get('format') or '').lower() != 'pdf':
                continue
            href = str(link.attrib.get('href') or '')
            if href.startswith('ftp://ftp.ncbi.nlm.nih.gov/'):
                href = 'https://ftp.ncbi.nlm.nih.gov/' + href.split('ftp://ftp.ncbi.nlm.nih.gov/', 1)[1]
            if href.startswith(('http://', 'https://')):
                return href
    except Exception:
        return ""
    finally:
        response.close()
    return ""
'''
          script = script.replace(helper_anchor, helper + helper_anchor, 1)

          old_block = '''    candidates, is_oa, oa_status, oa_landing = openalex_candidates(openalex)
    epmc_candidates, pmcid, epmc_landing = europepmc_candidates(europe)
    candidates.extend(c for c in epmc_candidates if c not in candidates)
    known_oa = is_oa or bool(epmc_candidates)
    candidates.extend(c for c in crossref_oa_candidates(crossref, known_oa) if c not in candidates)
    result.open_access = known_oa
    result.oa_status = oa_status or ("repository" if pmcid else "")
    if oa_landing:
        result.landing_url = oa_landing
    elif epmc_landing:
        result.landing_url = epmc_landing
    elif result.doi and not result.landing_url:
        result.landing_url = f"https://doi.org/{result.doi}"
'''
          new_block = '''    candidates, is_oa, oa_status, oa_landing = openalex_candidates(openalex)
    upw_candidates, upw_status, upw_landing = unpaywall_candidates(client, result.doi)
    candidates.extend(c for c in upw_candidates if c not in candidates)
    epmc_candidates, pmcid, epmc_landing = europepmc_candidates(europe)
    candidates.extend(c for c in epmc_candidates if c not in candidates)
    pmc_pdf = pmc_oa_pdf_candidate(client, pmcid)
    if pmc_pdf:
        add_candidate(candidates, pmc_pdf, "PMC Open Access PDF package")
    known_oa = is_oa or bool(upw_candidates) or bool(epmc_candidates) or bool(pmc_pdf)
    candidates.extend(c for c in crossref_oa_candidates(crossref, known_oa) if c not in candidates)
    result.open_access = known_oa
    result.oa_status = oa_status or upw_status or ("repository" if pmcid else "")
    if oa_landing:
        result.landing_url = oa_landing
    elif upw_landing:
        result.landing_url = upw_landing
    elif epmc_landing:
        result.landing_url = epmc_landing
    elif result.doi and not result.landing_url:
        result.landing_url = f"https://doi.org/{result.doi}"
'''
          assert old_block in script
          script = script.replace(old_block, new_block, 1)
          script_path.write_text(script, encoding='utf-8')
          print(f'Validated {len(refs)} unique references and patched OA retrieval')
          PY
          python -m py_compile scripts/download_literature.py
          python - <<'PY'
          import json
          from pathlib import Path
          refs = json.loads(Path('data/references.json').read_text(encoding='utf-8'))
          shards = 8
          for i in range(shards):
              Path(f'data/shard_{i}.json').write_text(
                  json.dumps(refs[i::shards], ensure_ascii=False), encoding='utf-8'
              )
          print(f'Split {len(refs)} references into {shards} shards')
          PY

      - name: Resolve references and download open-access PDFs in parallel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle_parts
          pids=()
          for f in data/shard_*.json; do
            n="${f##*_}"
            n="${n%.json}"
            python scripts/download_literature.py \
              --input "$f" \
              --output "bundle_parts/shard_${n}" \
              > "bundle_parts/shard_${n}.runner.log" 2>&1 &
            pids+=("$!")
          done
          rc=0
          for pid in "${pids[@]}"; do
            wait "$pid" || rc=1
          done
          if [ "$rc" -ne 0 ]; then
            echo 'At least one shard failed.'
            for f in bundle_parts/*.runner.log; do
              echo "===== $f ====="
              tail -100 "$f" || true
            done
            exit 1
          fi

      - name: Merge shard outputs
        run: |
          python - <<'PY'
          import csv
          import json
          import shutil
          from pathlib import Path

          root = Path('bundle_parts')
          out = Path('bundle')
          out.mkdir(parents=True, exist_ok=True)
          rows = []
          metadata = []
          fieldnames = None
          logs = []

          parts = sorted(p for p in root.glob('shard_*') if p.is_dir())
          for part in parts:
              pdfs = part / 'pdfs'
              if pdfs.exists():
                  shutil.copytree(pdfs, out / 'pdfs', dirs_exist_ok=True)
              table = part / 'all_references_resolved.csv'
              if table.exists():
                  with table.open(encoding='utf-8-sig', newline='') as handle:
                      reader = csv.DictReader(handle)
                      if fieldnames is None:
                          fieldnames = reader.fieldnames
                      rows.extend(reader)
              meta = part / 'resolved_metadata.json'
              if meta.exists():
                  metadata.extend(json.loads(meta.read_text(encoding='utf-8')))
              log = part / 'download_log.txt'
              if log.exists():
                  logs.append(f'===== {part.name}/download_log.txt =====\n' + log.read_text(encoding='utf-8', errors='replace'))
              runner_log = root / f'{part.name}.runner.log'
              if runner_log.exists():
                  logs.append(f'===== {runner_log.name} =====\n' + runner_log.read_text(encoding='utf-8', errors='replace'))

          rows.sort(key=lambda row: int(row['id']))
          metadata.sort(key=lambda row: int(row['id']))
          assert len(rows) == 211 and len({row['id'] for row in rows}) == 211
          fieldnames = fieldnames or []
          with (out / 'all_references_resolved.csv').open('w', encoding='utf-8-sig', newline='') as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)

          unavailable = [row for row in rows if row.get('status') != 'downloaded']
          with (out / 'unavailable_title_doi.csv').open('w', encoding='utf-8-sig', newline='') as handle:
              writer = csv.writer(handle)
              writer.writerow(['id', 'title', 'doi', 'status', 'reason', 'landing_url'])
              for row in unavailable:
                  writer.writerow([
                      row.get('id', ''),
                      row.get('resolved_title') or row.get('requested_title', ''),
                      row.get('doi') or 'DOI not resolved',
                      row.get('status', ''),
                      row.get('note', ''),
                      row.get('landing_url', ''),
                  ])

          (out / 'resolved_metadata.json').write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          (out / 'download_log.txt').write_text('\n\n'.join(logs) + '\n', encoding='utf-8')

          downloaded = [row for row in rows if row.get('status') == 'downloaded']
          lines = [
              '# PhD Part I literature bundle',
              '',
              f'- Requested references: **{len(rows)}**',
              f'- Open-access PDFs downloaded: **{len(downloaded)}**',
              f'- Not downloaded: **{len(unavailable)}**',
              '',
              'Only openly accessible copies were downloaded. The workflow did not bypass paywalls, authentication, robots controls, or publisher access restrictions.',
              '',
              '## Contents',
              '',
              '- `pdfs/`: downloaded PDFs grouped by thesis topic.',
              '- `all_references_resolved.csv`: complete metadata and retrieval status.',
              '- `unavailable_title_doi.csv`: title and DOI (when resolved) for every item without a downloaded PDF.',
              '- `resolved_metadata.json`: machine-readable metadata.',
              '- `download_log.txt`: combined diagnostic log.',
              '- `requested_references.json`: the requested 211-item bibliography.',
              '',
              '## Downloaded papers',
              '',
          ]
          for row in downloaded:
              lines.append(f"- {row['id']}. {row.get('resolved_title') or row.get('requested_title')} — DOI: {row.get('doi') or 'not resolved'} — `{row.get('pdf_filename')}`")
          lines.extend(['', '## Not downloaded', ''])
          for row in unavailable:
              lines.append(f"- {row['id']}. {row.get('resolved_title') or row.get('requested_title')} — DOI: {row.get('doi') or 'not resolved'} — {row.get('status')}")
          (out / 'README.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'Merged {len(rows)} records: {len(downloaded)} PDFs, {len(unavailable)} unavailable')
          PY

      - name: Add requested bibliography
        run: cp data/references.json bundle/requested_references.json

      - name: Upload literature bundle
        uses: actions/upload-artifact@v4
        with:
          name: PhD_Part1_literature_bundle
          path: bundle/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
